version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: solicitudes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-solicitudes_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-solicitudes_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  # NODO 1 (App A)
  app_a:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_a
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=${POSTGRES_DB:-solicitudes_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net

  # NODO 2 (App B)
  app_b:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_b
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=${POSTGRES_DB:-solicitudes_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net

  # LOAD BALANCER (Nginx simulando ALB/API Gateway)
  nginx:
    image: nginx:alpine
    container_name: solicitudes_load_balancer
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_a
      - app_b
    networks:
      - backend_net

  # CONSUMIDOR
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: solicitudes_consumer
    environment:
      - API_URL=http://nginx:8000 
      - CONSUMER_RETRIES=${CONSUMER_RETRIES:-3}
      - CONSUMER_TIMEOUT=${CONSUMER_TIMEOUT:-5}
    volumes:
      - ./consumer:/app
    depends_on:
      - nginx
    networks:
      - backend_net

volumes:
  postgres_data:

networks:
  backend_net:
    driver: bridge
